name: Publish Claude Onboarding to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syncoria-claude-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bedrock bootstrap and guardrails
        run: python3 docs/validate.py
      - name: Build site, skills plugin and marketplace
        run: python3 scripts/build_pages_marketplace.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
